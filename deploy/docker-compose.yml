# OCI 서버 /opt/mapledelta 에 놓인다. CI 가 매 배포마다 이 파일을 덮어쓴다.
# 비밀값은 같은 디렉터리의 .env (커밋하지 않음, deploy/.env.example 참고).
services:
  app:
    image: ghcr.io/kimgooner/maple-web-proj-v2:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXON_API_KEY: ${NEXON_API_KEY:?NEXON_API_KEY 가 .env 에 없다}
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
