# OCI 서버 /opt/mapledelta 에 놓인다. CI 가 매 배포마다 이 파일을 덮어쓴다.
# 비밀값은 같은 디렉터리의 .env (커밋하지 않음, deploy/.env.example 참고).
services:
  app:
    image: ghcr.io/kimgooner/maple-web-proj-v2:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NEXON_API_KEY: ${NEXON_API_KEY:?NEXON_API_KEY 가 .env 에 없다}
      SPRING_PROFILES_ACTIVE: prod
      MAPLE_CACHE_TYPE: redis
      MAPLE_LEVEL_BAND_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 프런트를 서빙하고 /api 만 app 으로 넘긴다. Caddy 는 TLS 만 맡는다.
  web:
    image: ghcr.io/kimgooner/maple-web-proj-v2-web:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 데이터시트 캐시. 지나간 날짜는 넥슨이 같은 값을 주므로 길게 들고 있는다.
  # RDB 를 남겨 컨테이너를 재시작해도 캐시가 산다. 포트는 밖으로 내지 않는다.
  #
  # volatile-lru 는 만료가 걸린 키만 밀어낸다. 캐시는 전부 TTL 이 있어 그대로 밀려나고,
  # 레벨 구간 표본처럼 만료 없이 넣은 값은 메모리가 차도 남는다. allkeys-lru 로 두면
  # 이게 쓸려 나갔을 때 부팅하며 다시 긁어, 배포할 때마다 8,000명을 다시 재게 된다.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru", "--save", "300", "1"]
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
