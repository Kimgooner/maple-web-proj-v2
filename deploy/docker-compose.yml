# OCI 서버 /opt/mapledelta 에 놓인다. CI 가 매 배포마다 이 파일을 덮어쓴다.
# 비밀값은 같은 디렉터리의 .env (커밋하지 않음, deploy/.env.example 참고).
services:
  app:
    image: ghcr.io/kimgooner/maple-web-proj-v2:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NEXON_API_KEY: ${NEXON_API_KEY:?NEXON_API_KEY 가 .env 에 없다}
      SPRING_PROFILES_ACTIVE: prod
      MAPLE_CACHE_TYPE: redis
      NEXON_RPS: "450"
      MAPLE_LEVEL_BAND_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      # JVM 힙 상한(-Xmx2g)은 Dockerfile 의 JAVA_TOOL_OPTIONS 에 있다. 여기서 덮어쓰면 GC·시간대 옵션까지 사라진다.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 프런트를 서빙하고 /api 만 app 으로 넘긴다. TLS 도 여기서 끝난다 — 앞은 Cloudflare 다.
  # 인증서는 Cloudflare Origin CA. 서버의 ./certs (origin.pem, origin.key) 를 읽기 전용으로 마운트한다.
  # Git 에도 이미지에도 넣지 않는다.
  web:
    image: ghcr.io/kimgooner/maple-web-proj-v2-web:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 데이터시트 캐시. 지나간 날짜는 넥슨이 같은 값을 주므로 길게 들고 있는다.
  # RDB 를 남겨 컨테이너를 재시작해도 캐시가 산다. 포트는 밖으로 내지 않는다.
  #
  # volatile-lru 는 만료가 걸린 키만 밀어낸다. 캐시는 전부 TTL 이 있어 그대로 밀려나고,
  # 레벨 구간 표본처럼 만료 없이 넣은 값은 메모리가 차도 남는다. allkeys-lru 로 두면
  # 이게 쓸려 나갔을 때 부팅하며 다시 긁어, 배포할 때마다 8,000명을 다시 재게 된다.
  #
  # maxmemory 12GB: 24GB 서버에서 OS 3 + JVM 3 을 빼고, Redis RSS 가 maxmemory × 단편화(1.2~1.5)
  # 까지 가는 것과 RDB 저장 fork 의 copy-on-write 여유까지 본 상한이다. gzip 시트 10KB 기준
  # 60만 구간, 추이 지점 400B 기준 70만 캐릭터분이다. 이 위로는 LRU 가 안 읽힌 것부터 밀어낸다.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "12gb", "--maxmemory-policy", "volatile-lru", "--save", "300", "1"]
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  redis_data:
