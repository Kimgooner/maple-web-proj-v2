plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.5'
}

group = 'org.whitedoggy'
version = '0.0.1-SNAPSHOT'
description = 'mapleweb2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 골든 기준선 갱신: ./gradlew test -Dgolden.update=true
    maxHeapSize = '2g'
    systemProperty 'golden.update', System.getProperty('golden.update', 'false')
    // 진단 도구용 시스템 프로퍼티는 여기에 등록해야 테스트 JVM으로 넘어간다.
    // 빠뜨리면 @EnabledIfSystemProperty 때문에 테스트가 조용히 SKIPPED 된다.
    ['select.staging', 'select.count', 'source.job', 'source.names', 'union.probe',
     'adhoc.fixture', 'ablation.names', 'item.names'].each { key ->
        if (System.getProperty(key)) { systemProperty key, System.getProperty(key) }
    }
}
