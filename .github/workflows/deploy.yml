name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GHCR 이미지 이름은 소문자여야 한다 (github.repository 는 Kimgooner 로 시작)
  IMAGE: ghcr.io/kimgooner/maple-web-proj-v2
  WEB_IMAGE: ghcr.io/kimgooner/maple-web-proj-v2-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 골든 테스트(org.whitedoggy.mapleweb2.golden.*)는 픽스처가 로컬 전용이라 CI 에서 뺀다.
      - name: Backend test and jar
        run: |
          ./gradlew --no-daemon test \
            --tests 'org.whitedoggy.mapleweb2.Mapleweb2ApplicationTests' \
            --tests 'org.whitedoggy.mapleweb2.global.*' \
            --tests 'org.whitedoggy.mapleweb2.analysis.*' \
            --tests 'org.whitedoggy.mapleweb2.domain.*'
          ./gradlew --no-daemon bootJar
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar')" build/app.jar

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 프런트는 nginx 이미지로 따로 나간다. 두 이미지가 같은 APP_TAG 로 움직인다.
      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # 호스트 키는 secrets.OCI_HOST_KEY 에 박아 두고 그것만 믿는다. ssh-keyscan 은 그때
      # 돌아온 키를 그냥 받아 적는 것이라, 러너와 서버 사이에 낀 누군가가 자기 키를 내밀면
      # 그대로 신뢰해 버린다 - 그 접속에 배포용 개인키와 GHCR 토큰이 실려 나간다.
      # 값 만드는 법: ssh-keyscan -t ed25519 <서버IP>  (한 줄을 통째로 넣는다)
      - name: SSH key
        env:
          HOST_KEY: ${{ secrets.OCI_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "$HOST_KEY" ]; then
            echo "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::OCI_HOST_KEY 가 없어 ssh-keyscan 으로 대신한다. 중간자에 노출된다."
            ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose files
        run: |
          scp -i ~/.ssh/deploy deploy/docker-compose.yml deploy/Caddyfile \
            "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/opt/mapledelta/"

      # 서버는 GHCR 에 상시 로그인하지 않는다. 배포 순간에만 이 워크플로의 토큰으로 pull 한다.
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/mapledelta
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull --quiet app web redis
          docker compose up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          for i in $(seq 1 30); do
            if docker compose exec -T app bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null; then
              echo "app is listening (after ${i}x2s)"; break
            fi
            if [ "$i" = 30 ]; then echo "app did not come up"; docker compose logs --tail 50 app; exit 1; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1/ && echo "caddy -> web ok"
          docker image prune -f >/dev/null
          REMOTE
