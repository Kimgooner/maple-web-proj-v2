# 단일 펫 고유 버프 스킬 목록.
#
# 펫 버프는 두 종류다.
#
#   1) 세트 버프 — 같은 세트의 멀티펫 종류 수에 따라 3단계로 강화된다.
#      이름에 `Lv.1` / `Lv.2` / `Lv.3` 이 붙으므로 SkillParser 의 패턴이 자동으로 잡는다.
#      (블루밍 플로라 Lv.1, 놀이공원의 마스코트 Lv.2, 강해지겠다람쥐 …)
#      → 여기 적을 필요 없다.
#
#   2) 단일 펫 고유 버프 — 단계가 없어 이름에 `Lv.N` 이 붙지 않는다.
#      패턴에 걸리지 않으므로 이름을 직접 등록해야 한다. 이 파일이 그 목록이다.
#
# 수치는 적지 않는다. API 의 skill_effect 텍스트("공격력 5, 마력 5 증가")를 그대로 파싱한다.
#
# 새 이름을 찾는 방법: 골든 실행 후 build/reports/golden/unreflected-skills.txt 를 본다.
# 반영하지 않은 0차 스킬 중 전투 스탯을 가진 것이 전부 나오므로, 펫 버프가 새로 생기면 드러난다.

maple:
  pet:
    # 확인 경로: 픽스처 480건에서 이 이름을 가진 캐릭터가 전원 계산 불일치였고,
    # 반영 후 보우마스터 투엘리·블래스터 유리카·섀도어 섀마가 정수까지 일치했다.
    buff-skill-names:
      - 달콤하담              # 달콤한 정령 펫. 공/마 5
      - 절세미호 펫의 버프        # 절세미호 펫. 공/마 5
