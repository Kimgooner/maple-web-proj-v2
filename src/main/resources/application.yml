spring:
  application:
    name: maplehistory

  config:
    import:
      # 저장소 루트 .env 를 속성으로 읽는다. 로컬에서 ./gradlew bootRun 만으로 뜨게 하려는
      # 것이다 — 안 그러면 키 없이 떠서 넥슨이 400 을 주고, 화면에는 "그런 이름의 캐릭터가
      # 없습니다"로만 보여 원인을 찾기 어렵다. optional 이라 파일이 없어도(프로덕션 컨테이너)
      # 그냥 넘어가고, 그쪽은 compose 가 넣는 환경 변수를 쓴다.
      - optional:file:.env[.properties]
      - classpath:event-buffs.yml
      - classpath:game-data.yml
      - classpath:challengers-buffs.yml
      - classpath:hexa-core-cost.yml

  profiles:
    active: local

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 캐시가 죽었을 때 오래 붙들지 않고 미스로 떨어지게 짧게 잡는다.
      timeout: 2s
      connect-timeout: 2s

maple:
  # 레벨 구간별 전투력 분포 배치. 매주 월요일 00시에 8,000명을 재느라 API 를 14만 회 쓴다.
  # 로컬·테스트가 이걸 돌리는 일이 없게 기본은 꺼짐이고, 프로덕션에서만 켠다.
  level-band:
    enabled: ${MAPLE_LEVEL_BAND_ENABLED:false}

  # memory: 프로세스 안에만 사는 캐시 (로컬·테스트 기본).
  # redis:  재시작에도 남는 캐시. 프로덕션은 MAPLE_CACHE_TYPE=redis 로 켠다.
  cache:
    type: ${MAPLE_CACHE_TYPE:memory}

nexon:
  api:
    base-url: https://open.api.nexon.com
    # 프로덕션은 compose 가 NEXON_API_KEY 를 넣는다. 로컬은 저장소 루트 .env 에 이미
    # MAPLE_OPEN_API_KEY 로 들어 있어(스킬 스크립트가 쓰는 이름), 둘 다 받는다.
    # 안 그러면 키 없이 떠서 조용히 400 이 나고 "그런 캐릭터가 없습니다"로만 보인다.
    api-key: ${NEXON_API_KEY:${MAPLE_OPEN_API_KEY:}}
    request-timeout: 5s
    max-concurrency: 8
    requests-per-second: 300
