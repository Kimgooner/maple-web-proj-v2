      # 작 보정 12가 함께 검증된다. 아스트라 착용/미착용, 추가 캐시 장비 유무, 세트 수로
      # 갈라도 같은 값이라 제로 전용 처리들도 함께 검증됐다.
      #
      # 인덱스는 add-option과 같은 1추~5추 순서다. 3~5추는 표본이 없어 비워 둔다 —
      # 없으면 weaponNormalizationFailed 플래그가 서서 조용히 틀리지 않는다.
      zero-bow-add-option:
