      # 태도·대검(제로 라즐리/라피스)이 전투력에서 환산되는 활 공격력.
      #
      # 다른 무기는 "같은 추 단계의 활 값"을 그대로 쓰면 맞는데(46개 직업 444명 정수 일치),
      # 태도만 그 대응이 성립하지 않는다. 활 사다리에 179라는 값이 아예 없다.
      # 아래 값은 역산으로 잡았다 — 각 값은 그 무기를 낀 제로 전원의 전투력을 API와
      # 정수까지 일치시키는 유일한 정수다(기준일 2026-08-24, 랭킹 표본 647명).
      #
      #   데스티니 1추  128/128명이 179   | 데스티니 2추  26/26명이 131
      #   제네시스 1추  302/308명이 140   | 제네시스 2추 102/106명이 102
      #   아케인셰이드 1추  1명이 122
