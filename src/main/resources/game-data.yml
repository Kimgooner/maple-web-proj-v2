    # 공격력 대신 마력을 쓰는 직업.
    magic-classes:
      - "비숍"
      - "아크메이지(불,독)"
      - "아크메이지(썬,콜)"
      - "플레임위자드"
      - "배틀메이지"
      - "에반"
      - "일리움"
      - "라라"
      - "키네시스"
      - "루미너스"
      - "레테"

    # 파이렛 블레스(모험가 해적 링크 스킬)를 가진 직업.
    # 스킬을 켜면 무기·보조무기·아케인심볼·어센틱심볼·펫장비를 뺀 장착 장비의
    # 힘과 민첩이 바뀌어 적용된다. AP·하이퍼스탯·시드링·유니온·스탯 물약은 바뀌지 않는다.
    # API가 사용 여부를 주지 않으므로 켠 쪽과 끈 쪽을 모두 계산해 전투력이 높은 쪽을 쓴다.
    adventure-pirate-jobs:
      - "바이퍼"
      - "캡틴"
      - "캐논마스터"

    # 직업별 소모품(화살·표창 등) 공격력.
    consumable-attack:
      "[보우마스터]": 9
      "[신궁]": 9
      "[윈드브레이커]": 9
      "[와일드헌터]": 9
      "[나이트로드]": 29
      "[나이트워커]": 29
      "[캡틴]": 22

    # 마력 기반 무기 부위. 무기 추가옵션을 magic_power에서 읽을지 결정한다.
    magic-weapon-parts: ["완드", "샤이닝 로드", "ESP 리미터", "매직 건틀렛", "스태프", "카르타"]

    # ── 무기 정규화 데이터 ─────────────────────────────────────────────
    # 전투력은 무기 종류에 상관없이 활 기준으로 정규화한 공격력을 쓴다.
    weapon:
      # 무기 이름에 키워드가 있으면 그 세트로 본다. 위에서부터 검사하고 뒤에 맞는 것이 이긴다.
      # 어느 것도 안 맞으면 default-set을 쓰되 주문서 작(scroll)은 더하지 않는다.
      #
      # scroll         = assumed-scroll 회 작했을 때 표값에 더해야 하는 공격력
      # assumed-scroll = star-force 표와 scroll이 전제하는 주문서 작 횟수
      #
      # 실제 작 횟수가 이와 다르면 차이 1회당 12를 보정한다(주문서 9 + 그로 인한
      # 스타포스 상승 3). 실측: 데스티니 스태프 22성이 8작 base445/sf310/etc72,
      # 9작 base445/sf313/etc81 — 작 하나에 기본 +9, 스타포스 +3.
      default-set: 제네시스
      sets:
        - name: 도전자
          keywords: [도전자]
          scroll: 0
          # 표본이 없어 미검증. 아케인셰이드와 같은 형태로 둔다.
          assumed-scroll: 9
        - name: 앱솔랩스
          keywords: [앱솔랩스, 8형]
          scroll: 81
          assumed-scroll: 9
        - name: 아케인셰이드
          keywords: [아케인셰이드, 9형]
          # 표값(22성 592 = base 276 + 작 81 + 스타포스 235)에 작이 이미 포함돼 있어 0이다.
          scroll: 0
          assumed-scroll: 9
        - name: 제네시스
          keywords: [제네시스]
          # 표값 564 = base 318 + 스타포스 246. 작 72는 따로 더한다.
          scroll: 72
          assumed-scroll: 8
        - name: 데스티니
          keywords: [데스티니]
          scroll: 72
          assumed-scroll: 8

      # 세트별 스타포스 공격력. 인덱스가 곧 스타포스(0~30)다.
