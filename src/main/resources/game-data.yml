# 게임 콘텐츠 데이터. 코드가 아니라 여기서 관리한다.
# 신규 직업/무기가 나오면 이 파일만 고치면 된다.

maple:
  game:
    # 직업별 주스탯/부스탯. 넥슨 API의 character_class 값과 정확히 일치해야 한다.
    # (예: "캐논마스터"가 맞다. "캐논슈터"로 적으면 해당 직업이 통째로 실패한다.)
    job-stats:
      "[히어로]": { main: [STR], sub: [DEX] }
      "[팔라딘]": { main: [STR], sub: [DEX] }
      "[다크나이트]": { main: [STR], sub: [DEX] }
      "[아크메이지(불,독)]": { main: [INT], sub: [LUK] }
      "[아크메이지(썬,콜)]": { main: [INT], sub: [LUK] }
      "[비숍]": { main: [INT], sub: [LUK] }
      "[보우마스터]": { main: [DEX], sub: [STR] }
      "[신궁]": { main: [DEX], sub: [STR] }
      "[패스파인더]": { main: [DEX], sub: [STR] }
      "[나이트로드]": { main: [LUK], sub: [DEX] }
      "[섀도어]": { main: [LUK], sub: [DEX, STR] }
      "[듀얼블레이더]": { main: [LUK], sub: [DEX, STR] }
      "[바이퍼]": { main: [STR], sub: [DEX] }
      "[캡틴]": { main: [DEX], sub: [STR] }
      "[캐논마스터]": { main: [STR], sub: [DEX] }
      "[소울마스터]": { main: [STR], sub: [DEX] }
      "[플레임위자드]": { main: [INT], sub: [LUK] }
      "[윈드브레이커]": { main: [DEX], sub: [STR] }
      "[나이트워커]": { main: [LUK], sub: [DEX] }
      "[스트라이커]": { main: [STR], sub: [DEX] }
      "[미하일]": { main: [STR], sub: [DEX] }
      "[블래스터]": { main: [STR], sub: [DEX] }
      "[배틀메이지]": { main: [INT], sub: [LUK] }
      "[와일드헌터]": { main: [DEX], sub: [STR] }
      "[메카닉]": { main: [DEX], sub: [STR] }
      "[제논]": { main: [STR, DEX, LUK], sub: [] }
      "[데몬슬레이어]": { main: [STR], sub: [DEX] }
      "[데몬어벤져]": { main: [HP], sub: [STR] }
      "[아란]": { main: [STR], sub: [DEX] }
      "[에반]": { main: [INT], sub: [LUK] }
      "[메르세데스]": { main: [DEX], sub: [STR] }
      "[팬텀]": { main: [LUK], sub: [DEX] }
      "[루미너스]": { main: [INT], sub: [LUK] }
      "[은월]": { main: [STR], sub: [DEX] }
      "[카이저]": { main: [STR], sub: [DEX] }
      "[엔젤릭버스터]": { main: [DEX], sub: [STR] }
      "[카데나]": { main: [LUK], sub: [STR, DEX] }
      "[카인]": { main: [DEX], sub: [STR] }
      "[아델]": { main: [STR], sub: [DEX] }
      "[일리움]": { main: [INT], sub: [LUK] }
      "[아크]": { main: [STR], sub: [DEX] }
      "[칼리]": { main: [LUK], sub: [DEX] }
      "[호영]": { main: [LUK], sub: [DEX] }
      "[라라]": { main: [INT], sub: [LUK] }
      "[렌]": { main: [STR], sub: [DEX] }
      "[제로]": { main: [STR], sub: [DEX] }
      "[레테]": { main: [INT], sub: [LUK] }
      "[키네시스]": { main: [INT], sub: [LUK] }

    # 공격력 대신 마력을 쓰는 직업.
    magic-classes:
      - "비숍"
      - "아크메이지(불,독)"
      - "아크메이지(썬,콜)"
      - "플레임위자드"
      - "배틀메이지"
      - "에반"
      - "일리움"
      - "라라"
      - "키네시스"
      - "루미너스"
      - "레테"

    # 파이렛 블레스(모험가 해적 링크 스킬)를 가진 직업.
    # 스킬을 켜면 무기·보조무기·아케인심볼·어센틱심볼·펫장비를 뺀 장착 장비의
    # 힘과 민첩이 바뀌어 적용된다. AP·하이퍼스탯·시드링·유니온·스탯 물약은 바뀌지 않는다.
    # API가 사용 여부를 주지 않으므로 켠 쪽과 끈 쪽을 모두 계산해 전투력이 높은 쪽을 쓴다.
    adventure-pirate-jobs:
      - "바이퍼"
      - "캡틴"
      - "캐논마스터"

    # 컨버전 스타포스를 가진 직업.
    #
    # "장착한 장비의 스타포스 강화 10성당 STR, DEX, LUK 능력치가 각각 7씩 증가한다.
    #  컨버전 스타포스에 적용되는 스타포스는 최대 100성으로 제한된다. 훈장과 칭호의
    #  스타포스 강화 및 길드 스킬로 증가하는 스타포스는 효과를 받을 수 없다."
    #
    # 세 스탯에 같은 값이 붙으므로 올스탯로 넣는다(퍼센트 적용 대상).
    # 전투력 계산이 뜻을 갖는 최소 레벨.
    #
    # 이 아래는 지원하지 않는다. 랭킹 표본에서 레벨 259 이하는 플래그 없는 30명이
    # 전원 어긋났고 오차가 -93%에서 +240%까지 튀었다. API가 주는 전투력 자체가
    # 장비와 맞지 않는 경우가 대부분이라 계산으로 좁힐 수 있는 구간이 아니다.
    # 참고로 레벨대별 오차율은 260대 86.5%, 270대 30.1%, 280대 4.3%, 290대 0.5%다.
    min-supported-level: 260

    # 주스탯 계산이 일반 직업과 다른 직업의 스탯항 계수.
    # 일반 직업은 (주스탯 x 4 + 부스탯)인데, 제논은 STR/DEX/LUK이 모두 주스탯이고
    # 부스탯이 없어 그 자리에 (STR + DEX + LUK) x 3.5 가 들어간다.
    # 3.5 = 4 x 0.875 이고 0.875는 제논 직업상수다.
    job-stat-factor:
      "[제논]": 3.5

    # 주스탯 계산이 일반 직업과 다른 직업(제논·데몬어벤져)에 곱해지는 직업 보정 상수.
    #
    # 출처: 넥슨 공식 게임정보 '전투력과 특수 스탯' —
    #   "일반적인 직업과 사용하는 주요 스탯 계산이 다른 데몬어벤져와 제논의 경우
    #    추가로 추가 상수가 전투력에 곱해지며, 직업 보정 상수는 현재 전투력에 따라
    #    다른 값이 적용됩니다."
    # 구간표는 공개돼 있지 않아(게임 내 물음표 툴팁에도 없다) 실측으로 찾았다.
    #
    #   보정 = base >= threshold 면 min-constant,
    #          아니면 round(min-constant + slope x log10(threshold / base), decimals)
    #   전투력 = floor(base x 보정)
    #
    # base 는 보정 전 전투력이다. 제논은 스탯항에 stat-factor(4 x 0.875)를 쓴다.
    # 랭킹 표본 866건으로 확정했다. 네 상수 중 하나라도 어긋나면 정수 일치가
    # 0건으로 떨어진다(임계 9천만/1억1천만 0건, 기울기 0.099/0.101 0건,
    # 하한 0.749/0.751 0건, 자릿수 5/7 각각 29건·26건).
    job-correction:
      jobs:
        - "제논"
      threshold: 100000000
      min-constant: 0.75
      slope: 0.1
      decimals: 6
      # 상한. 로그 공식이 base 1천만에서 갖는 값이라 하한(1억에서 0.75)과 대칭이다.
      # 실측 892명에서 817 -> 826, base 2천만 미만만 보면 21 -> 30이 된다.
      # 0.84는 813, 0.86 이상은 817로 개선이 없다.
      max-constant: 0.85

    conversion-starforce:
      jobs:
        - "제논"
        - "데몬어벤져"
      stat-per-step: 7      # 10성당 올스탯 증가량
      step: 10
      max-star: 100
      # 스타포스가 있어도 컨버전 대상이 아닌 부위.
      excluded-slots:
        - "훈장"
        - "칭호"

    # 직업군별로 갈리는 세트 옵션에서 어느 갈래를 탈지 장비 이름으로 정한다.
    #
    # 루타비스 2세트는 직업의 주스탯+부스탯을 준다. 주스탯이 하나인 직업은 그것으로
    # 고르면 되지만 제논은 STR/DEX/LUK이 모두 주스탯이라 정할 수 없다. 제논은 도적용과
    # 해적용 장비를 모두 낄 수 있고 실제로 착용한 쪽의 직업군 옵션을 받으므로,
    # 장비 이름의 직업군으로 판단한다.
    #
    # 표본 250명 중 어새신(도적) 착용 60명 · 원더러(해적) 착용 11명이었고,
    # 어새신 쪽을 LUK 갈래로 바꾸면 정수 일치가 5 -> 55명이 된다. 원더러는 현행
    # default(STR+DEX) 갈래가 이미 11명 전원 맞는다.
    equipment-job-group-stat:
      "[어새신]": "LUK"
      "[원더러]": "STR"

    # 세트 장비 이름에 들어가는 직업군 토큰.
    #
    # 같은 세트라도 직업군별로 별개 세트로 취급된다. 보통은 한 직업군 장비만 끼므로
    # 티가 안 나지만, 제논은 도적용과 해적용을 함께 낄 수 있어 두 세트가 동시에 성립한다.
    # (예: 에테르넬 파이렛 3 + 시프 1 + 데스티니 무기 1 -> API 가 해적 4 / 도적 2 로 준다)
    #
    # 무기처럼 토큰이 없는 부위는 어느 직업군이든 쓸 수 있어 모든 그룹에 함께 센다.
    #   방어구  나이트(전사) 메이지(마법사) 아처(궁수) 시프(도적) 파이렛(해적)
    #   루타비스 워리어(전사) 던위치(마법사) 레인져(궁수) 어새신(도적) 원더러(해적)
    set-job-group-tokens:
      - "나이트"
      - "메이지"
      - "아처"
      - "시프"
      - "파이렛"
      - "워리어"
      - "던위치"
      - "레인져"
      - "어새신"
      - "원더러"

    # 주스탯이 여럿인 직업(제논)은 무기 이름에 직업군 토큰이 없다.
    # 도적용 무기는 운, 해적용 무기는 힘이 붙으므로 기본 스탯으로 가른다.
    # (출처: 인벤 제논 장비편. 표본 61건 전원 일치 — LUK형 56건 도적 / STR형 5건 해적)
    weapon-job-group-by-stat:
      "[LUK]": "시프"
      "[STR]": "파이렛"

    # 직업별 소모품(화살·표창 등) 공격력.
    consumable-attack:
      "[보우마스터]": 9
      "[신궁]": 9
      "[윈드브레이커]": 9
      "[와일드헌터]": 9
      "[나이트로드]": 29
      "[나이트워커]": 29
      "[캡틴]": 22

    # 설명문(item_description)에만 최종 데미지가 적힌 장비. API 옵션 필드
    # (item_total_option / potential_option / item_add_option)에는 어디에도
    # 없어서 파서가 볼 수 없다.
    #
    # 최종 데미지는 곱연산이라 (100 + 최종뎀) 에 (1 + 값/100) 을 곱한다.
    #
    # 루인 포스실드: "자신의 최종 데미지가 10% 증가하지만 ... 피격 시 받는
    # 데미지가 데몬 슬레이어는 8%, 데몬 어벤져는 25% 증가한다."
    # 실측 - 데몬슬레이어 표본 3,600명 중 루인 포스실드 착용 평가 대상 103명이
    # 전원 어긋났고 102명이 x1.1 로 정수 일치한다. 아스트라(42명)·극한(22명)·
    # 블랙·미착용 착용자는 이 보정 없이 이미 맞는다.
    #
    # 아스트라 포스실드가 주는 '아스트라 인퓨전'도 같은 최종 데미지 10%지만
    # 켜고 끄는 스킬이라 전투력에 들어가지 않는다 - 착용자 42명 전원이 이 값을
    # 빼야 정수 일치하고, 넣으면 42명 전원이 어긋난다. 그래서 여기 없다.
    item-final-damage:
      "[루인 포스실드]": 10

    # 마력 기반 무기 부위. 무기 추가옵션을 magic_power에서 읽을지 결정한다.
    magic-weapon-parts: ["완드", "샤이닝 로드", "ESP 리미터", "매직 건틀렛", "스태프", "카르타"]

    # ── 무기 정규화 데이터 ─────────────────────────────────────────────
    # 전투력은 무기 종류에 상관없이 활 기준으로 정규화한 공격력을 쓴다.
    weapon:
      # 무기 이름에 키워드가 있으면 그 세트로 본다. 위에서부터 검사하고 뒤에 맞는 것이 이긴다.
      # 어느 것도 안 맞으면 default-set을 쓰되 주문서 작(scroll)은 더하지 않는다.
      #
      # scroll         = assumed-scroll 회 작했을 때 표값에 더해야 하는 공격력
      # assumed-scroll = star-force 표와 scroll이 전제하는 주문서 작 횟수
      #
      # 실제 작 횟수가 이와 다르면 차이 1회당 12를 보정한다(주문서 9 + 그로 인한
      # 스타포스 상승 3). 실측: 데스티니 스태프 22성이 8작 base445/sf310/etc72,
      # 9작 base445/sf313/etc81 — 작 하나에 기본 +9, 스타포스 +3.
      default-set: 제네시스
      sets:
        - name: 도전자
          keywords: [도전자]
          scroll: 0
          # 표본이 없어 미검증. 아케인셰이드와 같은 형태로 둔다.
          assumed-scroll: 9
        - name: 앱솔랩스
          keywords: [앱솔랩스, 8형]
          # 아케인셰이드와 같이 표값에 9작이 이미 들어 있어 0이다.
          # 실측 앱솔랩스 슈팅보우 0성 base 192, 표[0] 273 = 192 + 작 81.
          # "표 = base + 작 81 + 스타포스"로 놓으면 아케인셰이드와 스타포스
          # 비율이 0~22성 전 구간에서 0.005 이내로 겹친다.
          scroll: 0
          assumed-scroll: 9
        - name: 아케인셰이드
          keywords: [아케인셰이드, 9형]
          # 표값(22성 592 = base 276 + 작 81 + 스타포스 235)에 작이 이미 포함돼 있어 0이다.
          scroll: 0
          assumed-scroll: 9
        - name: 제네시스
          keywords: [제네시스]
          # 표값 564 = base 318 + 스타포스 246. 작 72는 따로 더한다.
          scroll: 72
          assumed-scroll: 8
          # min-star 를 두지 않는다. 스타포스 공격력을 표가 아니라 규칙으로 계산하게
          # 되면서 22성 미만도 그대로 나온다. 실제로 0성 제네시스가 표본에 51명 있다.
        - name: 봉인된 제네시스
          keywords: [봉인된 제네시스]
          # 해방 전 무기다. 스타포스도 주문서 작도 걸 수 없어 언제나 0성 0작이다.
          # 이름에 '제네시스'가 들어가 그대로 두면 22성 표값(564)을 받는다.
          scroll: 0
          assumed-scroll: 0
        - name: 데스티니
          keywords: [데스티니]
          scroll: 72
          assumed-scroll: 8

      # 활 기준 공격력과 아이템 레벨. 스타포스 공격력은 표가 아니라 아래 규칙으로 계산한다.
      #
      #   공격력 = 활 기본 공격력 + 주문서 작 공격력
      #   1~15성: 성마다 (현재 공격력 / 50 내림) + 1 씩 더한다 (누적 반영, 레벨 무관)
      #   16성 이상: star-force-16plus 의 아이템 레벨별 누적치를 더한다
      #
      # 출처: 나무위키 '메이플스토리/스타포스 강화' 5. 스탯 변동
      #   "무기, 보조무기는 [공격력, 마력 (순수 + 주문서 강화)] / 50을 소수점 첫째자리에서
      #    반올림한 수치 + 1만큼 추가 상승"
      # 문서는 반올림이라 적었지만 실측은 내림이 맞다.
      #
      # 랭킹 활 유저에서 실측한 58건(아케인셰이드 13~22성, 앱솔랩스 0~22성, 제네시스
      # 0·22성, 작 0~85)이 이 규칙과 100% 일치한다.
      bow-base-attack:
        "[도전자]": 192
        "[앱솔랩스]": 192
        "[아케인셰이드]": 276
        "[제네시스]": 318
        "[봉인된 제네시스]": 318
        "[데스티니]": 349
      bow-item-level:
        "[도전자]": 160
        "[앱솔랩스]": 160
        "[아케인셰이드]": 200
        "[제네시스]": 200
        "[봉인된 제네시스]": 200
        "[데스티니]": 250
      # 1~15성 계산에 쓰는 상수. 성마다 (현재 공격력 / divisor 내림) + bonus 를 더하고,
      # base-max-star 를 넘는 성부터는 star-force-16plus 를 쓴다.
      star-force-formula:
        divisor: 50
        bonus: 1
        base-max-star: 15

