# 챌린저스 월드 전용 버프.
#
# 챌린저스 월드는 유니온이 없는 대신 월드 전용 패시브가 붙는다. 티어가 스킬 이름에 드러나며
# (사파이어 이상은 "챌린저스"로 고정), 티어와 무관하게 API의 skill_effect는 항상 비어 있어
# 수치를 API로는 알 수 없다. 그래서 공식 표를 여기에 옮겨 둔다.
#
# 수치 출처: 메이플스토리 공식 이벤트 안내 "챌린저스 월드 시즌4" 티어별 스킬 혜택 표
#   https://maplestory.nexon.com/News/Event/Ongoing/1349
#
# 전투력에 들어가지 않는 항목(일반 몬스터 데미지·방어율 무시·크리티컬 확률·버프 지속시간·
# 스탠스·소환수·재사용 대기시간·길드 기여도·메소/드롭/경험치)은 옮기지 않았다.
#
# 시즌이 바뀌면 이 파일만 갱신하면 된다.

maple:
  challengers:
    # 캐릭터의 world_name이 이 접두사로 시작할 때만 적용한다 (챌린저스, 챌린저스2, 챌린저스3…).
    world-prefix: 챌린저스

    tier-effects:
      "[챌린저스 비기너]":
        - 공격력 50
        - 마력 50
        - 올스탯 50
        - 보스 몬스터 데미지 30%
        - 크리티컬 데미지 30%
        - 최대 HP/MP 2500
      "[챌린저스 브론즈]":
        - 공격력 50
        - 마력 50
        - 올스탯 50
        - 보스 몬스터 데미지 30%
        - 크리티컬 데미지 30%
        - 최대 HP/MP 2500
      "[챌린저스 실버]":
        - 공격력 55
        - 마력 55
        - 올스탯 60
        - 보스 몬스터 데미지 40%
        - 크리티컬 데미지 30%
        - 최대 HP/MP 3000
      "[챌린저스 골드]":
        - 공격력 60
        - 마력 60
        - 올스탯 70
        - 보스 몬스터 데미지 50%
        - 크리티컬 데미지 30%
        - 최대 HP/MP 3500
      "[챌린저스 플래티넘]":
        - 공격력 70
        - 마력 70
        - 올스탯 90
        - 보스 몬스터 데미지 60%
        - 크리티컬 데미지 35%
        - 최대 HP/MP 4500
      "[챌린저스 에메랄드]":
        - 공격력 80
        - 마력 80
        - 올스탯 100
        - 보스 몬스터 데미지 70%
        - 크리티컬 데미지 40%
        - 최대 HP/MP 5000
      "[챌린저스]":  # 사파이어 이상 (이름에 티어가 붙지 않는다)
        - 공격력 80
        - 마력 80
        - 올스탯 100
        - 보스 몬스터 데미지 70%
        - 크리티컬 데미지 40%
        - 최대 HP/MP 5000
