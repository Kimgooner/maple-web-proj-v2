# 전투력 계산에 반영할 0차 스킬 목록.
#
# 이벤트마다 바뀌므로 코드가 아니라 이 파일에서 관리한다. 값(수치)은 여기 적지 않는다 —
# 같은 버프라도 캐릭터마다 수치가 다르므로(예: 훈련 일지는 미션 진행도에 따라 다름)
# 이름만 등록하고 실제 값은 API의 skill_effect 텍스트에서 파싱한다.
#
# 새 이벤트가 시작되면 `maple-api` 스킬로 0차 스킬을 훑어 새 버프 이름을 찾아 추가하고,
# 골든 테스트를 -Dgolden.update=true 로 갱신한다.

maple:
  skill:
    # 이름이 일치하면 skill_effect를 그대로 파싱해 반영한다.
    direct-skill-names:
      - 파괴의 얄다바오트
      - "초월 : 결전의 의지"
      - 메이플 스위츠          # 지난 이벤트
      - 썸머 파워업            # 지난 이벤트
      - 훈련 일지              # 울티마 이벤트 (OVERDRIVE 쇼케이스 이후)
      # 루나 시즌 이벤트. 수치는 모두 skill_effect에서 파싱한다.
      - 루나 파워업
      - 루나 게더링            # 액티브 스킬이지만 "[패시브 효과 : 공격력 15, 마력 15]"가 상시 적용
      - 루나 익스텐션

    # API가 skill_effect를 빈 문자열로 주는 스킬. 이름만으로는 수치를 알 수 없어 여기에 적는다.
    # (challengers-buffs.yml과 같은 방식이다.)
    fixed-effect-skills:
      "[버닝 BEYOND]":
        # 출처: 메이플스토리 공식 업데이트 공지
        #   https://maplestory.nexon.com/news/update/805
        # 전투력과 무관한 항목(일반 몬스터 데미지 20%·방어율 무시 20%·아케인포스 100·
        # 어센틱포스 100)은 옮기지 않았다.
        - 올스탯 30
        - 공격력 30
        - 마력 30
        - 보스 몬스터 공격 시 데미지 20%
        - 최대 HP/MP 1500

    # 여러 개를 보유해도 가장 높은 것 하나만 적용한다.
    blessing-skill-names:
      - 정령의 축복
      - 여제의 축복

    # 레벨 0으로 보유하고 있으면 루시드 변신 상태를 의심한다.
    lucid-transform-skill-names:
      - 파괴의 얄다바오트
      - "초월 : 결전의 의지"

# 확인 후 의도적으로 제외한 스킬. 여기 있는 것은 다시 후보로 올리지 않는다.
# 오차를 역산하다 보면 아래 스킬들이 계속 그럴듯해 보이지만, 전부 확인이 끝났다.
#
#   연합의 의지        - !! 전투력에 반영되지 않는다. 확인 완료. 다시 넣지 말 것 !!
#                        (힘/민첩/지능/행운 5 + 공격력/마력 5 를 동시에 주기 때문에
#                         공격력이 조금 비어 보일 때마다 후보로 보이지만 아니다)
#   영웅의 메아리       - 액티브 버프. 스탯창 미반영
#   리스트레인트 링      - 액티브 버프
#   컨티뉴어스 링       - 액티브 버프
#   고급 무기 제련      - 소모품 사용 버프
#   소울웨폰 소환 계열    - 소환수 데미지는 별도 계산
#   챌린저스 패스 : 특별 지원 - 일반 몬스터 데미지·경험치뿐 (확인 완료)
