# HEXA 코어를 올리는 데 드는 솔 에르다 조각.
#
# 배열의 n번째 값은 (n-1)레벨 → n레벨 한 단계의 비용이다. 따라서 L레벨 코어에
# 지금까지 들어간 조각은 앞에서부터 L개를 더한 값이다. 30단계가 전부다.
# 솔 에르다(조각이 아닌 것)는 여기 담지 않는다 - 화면에 쓰지 않는다.
#
# 출처: MapleStory Wiki "HEXA Matrix" 의 Leveling Cost 표 (2026-09-08 확인)
#   https://maplestorywiki.net/w/HEXA_Matrix
# 교차검증: 나무위키 "HEXA 매트릭스" 의 0→30 누적값과 대조해 다섯 표가 정확히 일치했다.
#   ascent 4500 / third 3442 / mastery 2252 / boost 3383 / sol-janus-hecate 6268
#
# API 의 hexa_core_type 은 네 가지뿐인데 비용표는 일곱이라 갈라야 한다. 규칙은
# HexaCoreParser 에 있다.

maple:
  hexa:
    core-cost:
      # 스킬 코어 1번 (오리진). 6차 전직 때 1레벨로 주어져 0→1 이 무료다. 0→30 누적 4,400
      origin: [0, 30, 35, 40, 45, 50, 55, 60, 65, 200, 80, 90, 100, 110, 120, 130, 140, 150, 160, 350, 170, 180, 190, 200, 210, 220, 230, 240, 250, 500]
      # 스킬 코어 2번 (어센트). 0→1 에 조각 100 이 든다. 그 위로는 오리진과 같다. 0→30 누적 4,500
      ascent: [100, 30, 35, 40, 45, 50, 55, 60, 65, 200, 80, 90, 100, 110, 120, 130, 140, 150, 160, 350, 170, 180, 190, 200, 210, 220, 230, 240, 250, 500]
      # 스킬 코어 3번. 앞의 둘보다 싸다. 0→30 누적 3,442
      third: [140, 21, 26, 30, 34, 38, 43, 47, 51, 142, 62, 69, 77, 83, 91, 98, 105, 112, 120, 252, 128, 136, 145, 152, 161, 168, 177, 184, 193, 357]
      # 마스터리 코어. 0→30 누적 2,252
      mastery: [50, 15, 18, 20, 23, 25, 28, 30, 33, 100, 40, 45, 50, 55, 60, 65, 70, 75, 80, 175, 85, 90, 95, 100, 105, 110, 115, 120, 125, 250]
      # 강화 코어. 0→30 누적 3,383
      boost: [75, 23, 27, 30, 34, 38, 42, 45, 49, 150, 60, 68, 75, 83, 90, 98, 105, 113, 120, 263, 128, 135, 143, 150, 158, 165, 173, 180, 188, 375]
      # 공용 코어 중 솔 야누스·솔 헤카테. (솔 야누스는 전투에 안 들어가 계산에서 뺀다) 0→30 누적 6,268
      sol-janus-hecate: [125, 38, 44, 50, 57, 63, 69, 75, 82, 300, 110, 124, 138, 152, 165, 179, 193, 207, 220, 525, 234, 248, 262, 275, 289, 303, 317, 330, 344, 750]
      # 그 밖의 공용 코어 = 5차 공용 스킬 강화 (시그너스 팔랑크스 VI 등). 0→30 누적 4,035
      common-boost: [90, 25, 30, 35, 40, 45, 50, 55, 60, 180, 73, 81, 90, 98, 107, 115, 124, 132, 141, 315, 151, 160, 170, 179, 189, 198, 208, 217, 227, 450]
