<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Growth Dashboard</title>
    <style>
        :root {
            --bg-top: #fbfaf4;
            --bg-bottom: #f2eee1;
            --panel: rgba(255, 255, 255, 0.94);
            --line: rgba(112, 97, 79, 0.14);
            --text: #201a14;
            --muted: #6d5f51;
            --accent: #74af49;
            --accent-deep: #4e882f;
            --accent-soft: #edf7df;
            --warn: #fff4d8;
            --warn-line: #efcf7a;
            --shadow: 0 24px 54px rgba(68, 56, 43, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(188, 224, 145, 0.32), transparent 28%),
                radial-gradient(circle at top right, rgba(255, 224, 170, 0.24), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }

        main {
            width: min(1240px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 48px;
        }

        .hero,
        .panel,
        .metric-card,
        .change-chip,
        .timeline-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .hero,
        .panel {
            padding: 28px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent-deep);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1, h2, h3, p {
            margin: 0;
        }

        h1 {
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .hero-copy {
            margin-top: 14px;
            color: var(--muted);
            line-height: 1.72;
            max-width: 760px;
        }

        .page-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .page-links a {
            text-decoration: none;
            color: var(--text);
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(112, 97, 79, 0.14);
            background: rgba(255, 255, 255, 0.84);
            font-size: 14px;
            font-weight: 700;
        }

        .page-links a.current {
            background: var(--accent-soft);
            border-color: rgba(78, 136, 47, 0.24);
            color: var(--accent-deep);
        }

        .search-form {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1.4fr 1fr auto;
            gap: 12px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        input, button {
            font: inherit;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(112, 97, 79, 0.18);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
        }

        button {
            border: 0;
            border-radius: 16px;
            padding: 0 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #fbfff5;
            font-weight: 900;
            cursor: pointer;
            min-height: 52px;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.86);
            color: var(--text);
            border: 1px solid rgba(112, 97, 79, 0.14);
        }

        .status {
            min-height: 24px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .warning-box {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 18px;
            background: var(--warn);
            border: 1px solid var(--warn-line);
            color: #7a4f00;
            line-height: 1.6;
        }

        .dashboard {
            margin-top: 22px;
            display: grid;
            gap: 18px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1.3fr repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .metric-card {
            padding: 18px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background:
                radial-gradient(circle at 32% 28%, #fffced, #dbeeb7 70%),
                linear-gradient(135deg, #faf5de, #d7efb2);
            display: grid;
            place-items: center;
            font-size: 34px;
            border: 1px solid rgba(78, 136, 47, 0.16);
            box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.42);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .profile-sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .metric-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .metric-value {
            margin-top: 10px;
            font-size: clamp(22px, 2.8vw, 34px);
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .metric-foot {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .metric-foot strong {
            color: var(--accent-deep);
        }

        .main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 290px;
            gap: 18px;
            align-items: start;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-head h2 {
            font-size: 24px;
            letter-spacing: -0.03em;
        }

        .section-copy {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .range-tabs {
            display: inline-flex;
            gap: 8px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(116, 175, 73, 0.08);
        }

        .range-tab {
            border: 0;
            border-radius: 999px;
            padding: 8px 12px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .range-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #fbfff5;
        }

        .chart-card {
            position: relative;
            min-height: 430px;
            padding: 18px 18px 16px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 240, 0.92)),
                var(--panel);
            border: 1px solid rgba(112, 97, 79, 0.12);
            box-shadow: inset 0 -40px 80px rgba(188, 222, 144, 0.14);
            overflow: hidden;
        }

        .chart-grid {
            position: absolute;
            inset: 90px 24px 58px 62px;
            display: grid;
            grid-template-rows: repeat(5, 1fr);
        }

        .chart-grid span {
            border-top: 1px dashed rgba(112, 97, 79, 0.12);
        }

        .y-axis {
            position: absolute;
            top: 88px;
            left: 18px;
            bottom: 58px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .x-axis {
            position: absolute;
            left: 68px;
            right: 24px;
            bottom: 18px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .trend-svg {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 320px;
            display: block;
        }

        .pin-layer {
            position: absolute;
            inset: 90px 24px 58px 62px;
            z-index: 2;
        }

        .trend-pin {
            position: absolute;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 999px;
            transform: translate(-50%, -50%);
            background: transparent;
            cursor: pointer;
        }

        .trend-pin::before {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 999px;
            background: linear-gradient(135deg, #86cb61, #4f8b2d);
            box-shadow: 0 10px 22px rgba(79, 139, 45, 0.26);
            transition: transform 140ms ease, box-shadow 140ms ease;
        }

        .trend-pin::after {
            content: attr(data-index);
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 900;
        }

        .trend-pin:hover::before,
        .trend-pin.active::before {
            transform: scale(1.08);
            box-shadow: 0 14px 26px rgba(79, 139, 45, 0.34);
        }

        .pin-tooltip {
            position: absolute;
            width: min(290px, calc(100vw - 84px));
            padding: 16px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(112, 97, 79, 0.16);
            box-shadow: 0 30px 48px rgba(58, 45, 34, 0.18);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, calc(-100% - 16px)) scale(0.96);
            transition: opacity 150ms ease, transform 150ms ease;
        }

        .pin-tooltip.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, calc(-100% - 20px)) scale(1);
        }

        .tooltip-date {
            color: var(--muted);
            font-size: 12px;
            font-weight: 900;
        }

        .tooltip-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .tooltip-growth {
            margin-top: 6px;
            color: var(--accent-deep);
            font-size: 14px;
            font-weight: 800;
        }

        .tooltip-list {
            margin-top: 14px;
            display: grid;
            gap: 8px;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .tooltip-row strong {
            color: var(--text);
            font-weight: 800;
            text-align: right;
        }

        .recent-changes {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .change-chip {
            flex: 0 0 190px;
            padding: 14px;
        }

        .chip-date {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .chip-value {
            margin-top: 8px;
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-deep);
            letter-spacing: -0.04em;
        }

        .chip-note {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .side-stack {
            display: grid;
            gap: 14px;
        }

        .timeline-card {
            padding: 18px;
        }

        .timeline-card h3 {
            font-size: 18px;
            letter-spacing: -0.03em;
        }

        .timeline-list {
            margin-top: 14px;
            display: grid;
            gap: 12px;
        }

        .timeline-item {
            padding-top: 12px;
            border-top: 1px dashed rgba(112, 97, 79, 0.14);
        }

        .timeline-item:first-child {
            padding-top: 0;
            border-top: 0;
        }

        .timeline-item button {
            all: unset;
            display: block;
            width: 100%;
            cursor: pointer;
        }

        .timeline-item.is-active button {
            background: rgba(116, 175, 73, 0.08);
            border-radius: 16px;
            padding: 12px;
            margin: -12px;
        }

        .timeline-date {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .timeline-value {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .timeline-note {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .empty-state {
            padding: 18px;
            border-radius: 20px;
            border: 1px dashed rgba(112, 97, 79, 0.2);
            color: var(--muted);
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.68);
        }

        @media (max-width: 1100px) {
            .summary-grid,
            .main-grid {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 720px) {
            main {
                width: min(100% - 20px, 1240px);
                padding: 18px 0 34px;
            }

            .hero,
            .panel {
                padding: 18px;
            }

            .search-form,
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .chart-card {
                min-height: 390px;
                padding: 16px 12px 12px;
            }

            .chart-grid {
                inset: 94px 14px 58px 48px;
            }

            .pin-layer {
                inset: 94px 14px 58px 48px;
            }

            .x-axis {
                left: 52px;
                right: 14px;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="hero">
        <p class="eyebrow">Maple Analysis</p>
        <h1>변화 핀 중심 대시보드로 전투력 히스토리를 바로 읽는 실험 화면</h1>
        <p class="hero-copy">`index2.html`의 월간/연간 변화 결과를 메인 대시보드 형태로 끌어올린 화면입니다. 이력 데이터에서 변화 시점을 핀으로 배치하고, 핀 hover/click 시 해당 시점의 증가량과 변화 요약을 바로 보여줍니다.</p>
        <div class="page-links">
            <a href="/index.html">기존 1번 화면</a>
            <a href="/index2.html">기존 2번 화면</a>
            <a href="/index3.html" class="current">대시보드 3번 화면</a>
        </div>

        <form id="search-form" class="search-form">
            <div class="field">
                <label for="characterName">캐릭터 이름</label>
                <input id="characterName" name="characterName" required>
            </div>
            <div class="field">
                <label for="date">단일 조회 날짜</label>
                <input id="date" name="date" type="date" required>
            </div>
            <button type="submit">기준 데이터 조회</button>
        </form>
        <div class="actions">
            <button type="button" class="secondary" id="monthly-button">월간 변화 로드</button>
            <button type="button" class="secondary" id="yearly-button">연간 변화 로드</button>
        </div>
        <div id="status" class="status"></div>
        <div id="warning" class="warning-box" hidden></div>
    </section>

    <section id="dashboard" class="dashboard" hidden>
        <section id="summary-grid" class="summary-grid"></section>
        <section class="main-grid">
            <article class="panel">
                <div class="section-head">
                    <div>
                        <h2>전투력 추이</h2>
                        <p class="section-copy" id="chart-copy">월간/연간 이력을 불러오면 변화 핀과 상세 카드가 활성화됩니다.</p>
                    </div>
                    <div class="range-tabs">
                        <button class="range-tab" data-range="monthly">30일</button>
                        <button class="range-tab" data-range="yearly">1년</button>
                    </div>
                </div>

                <div class="chart-card" id="chart-card">
                    <div class="y-axis" id="y-axis"></div>
                    <div class="chart-grid" id="chart-grid">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <svg class="trend-svg" id="trend-svg" viewBox="0 0 860 320" preserveAspectRatio="none" aria-label="전투력 추이"></svg>
                    <div class="pin-layer" id="pin-layer"></div>
                    <div class="x-axis" id="x-axis"></div>
                </div>

                <div class="recent-changes" id="recent-changes"></div>
            </article>

            <aside class="side-stack">
                <article class="timeline-card">
                    <h3>상세 변화 목록</h3>
                    <div class="timeline-list" id="timeline-list"></div>
                </article>
                <article class="timeline-card">
                    <h3>현재 요약</h3>
                    <div class="timeline-list" id="insight-list"></div>
                </article>
            </aside>
        </section>
    </section>
</main>

<script>
    const form = document.getElementById("search-form");
    const dateInput = document.getElementById("date");
    const monthlyButton = document.getElementById("monthly-button");
    const yearlyButton = document.getElementById("yearly-button");
    const statusEl = document.getElementById("status");
    const warningEl = document.getElementById("warning");
    const dashboardEl = document.getElementById("dashboard");
    const summaryGridEl = document.getElementById("summary-grid");
    const chartCopyEl = document.getElementById("chart-copy");
    const yAxisEl = document.getElementById("y-axis");
    const xAxisEl = document.getElementById("x-axis");
    const trendSvgEl = document.getElementById("trend-svg");
    const pinLayerEl = document.getElementById("pin-layer");
    const recentChangesEl = document.getElementById("recent-changes");
    const timelineListEl = document.getElementById("timeline-list");
    const insightListEl = document.getElementById("insight-list");
    const rangeTabs = [...document.querySelectorAll(".range-tab")];

    const state = {
        currentSummary: null,
        historyRows: [],
        range: "monthly",
        activeIndex: 0
    };

    if (!dateInput.value) {
        dateInput.value = new Date().toISOString().slice(0, 10);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const characterName = form.characterName.value.trim();
        const date = form.date.value;
        if (!characterName || !date) {
            statusEl.textContent = "캐릭터 이름과 날짜를 모두 입력해주세요.";
            return;
        }

        statusEl.textContent = "기준 데이터를 조회하고 있습니다...";
        try {
            const data = await fetchJson(`/api/analysis/combat-power?characterName=${encodeURIComponent(characterName)}&date=${encodeURIComponent(date)}`);
            state.currentSummary = data;
            renderSummary(data);
            renderWarning(data);
            renderInsights(data);
            dashboardEl.hidden = false;
            statusEl.textContent = "기준 데이터 조회가 완료되었습니다.";

            if (!state.historyRows.length) {
                await loadHistory(state.range);
            } else {
                renderHistorySection();
            }
        } catch (error) {
            statusEl.textContent = `오류: ${error.message}`;
        }
    });

    monthlyButton.addEventListener("click", () => loadHistory("monthly"));
    yearlyButton.addEventListener("click", () => loadHistory("yearly"));
    rangeTabs.forEach((tab) => tab.addEventListener("click", () => loadHistory(tab.dataset.range)));

    async function loadHistory(range) {
        const characterName = form.characterName.value.trim();
        if (!characterName) {
            statusEl.textContent = "캐릭터 이름을 먼저 입력해주세요.";
            return;
        }

        state.range = range;
        syncRangeTabs();
        statusEl.textContent = `${range === "monthly" ? "월간" : "연간"} 변화 데이터를 불러오는 중입니다...`;

        try {
            const response = await fetchJson(`/api/analysis/combat-power/${range}?characterName=${encodeURIComponent(characterName)}`);
            state.historyRows = Array.isArray(response.entries) ? response.entries.map(normalizeEntry) : [];
            state.activeIndex = Math.max(0, state.historyRows.length - 1);
            dashboardEl.hidden = false;
            if (!state.currentSummary) {
                renderSummaryFromHistory(response);
                renderInsightsFromHistory(state.historyRows);
                renderWarningFromHistory(state.historyRows);
            }
            renderHistorySection();
            statusEl.textContent = `${range === "monthly" ? "월간" : "연간"} 변화 데이터 조회가 완료되었습니다.`;
        } catch (error) {
            statusEl.textContent = `오류: ${error.message}`;
        }
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(await response.text() || "요청에 실패했습니다.");
        }
        return response.json();
    }

    function normalizeEntry(entry) {
        if (!entry) {
            return null;
        }
        if (entry.currentPresetDataSheet || entry.combatPresetDataSheet) {
            return entry;
        }

        const dataSheet = entry.dataSheet ?? {};
        const estimatedCombatPower = Number(dataSheet.combatPower ?? 0);
        const summary = {
            estimatedCombatPower,
            currentCombatPower: null,
            difference: null,
            errorRatePercent: null,
            lucidTransformSuspected: Boolean(dataSheet.lucidTransformSuspected),
            changeSummary: null
        };

        return {
            ...entry,
            dataSheet,
            currentPresetDataSheet: summary,
            combatPresetDataSheet: summary
        };
    }

    function renderSummary(data) {
        const entry = Array.isArray(data.entries) ? normalizeEntry(data.entries[0]) : null;
        const current = entry?.currentPresetDataSheet;
        const combat = entry?.combatPresetDataSheet;
        const date = entry?.date ?? "-";
        summaryGridEl.innerHTML = `
            <article class="metric-card profile-card">
                <div class="avatar">${renderAvatar(data.characterClass)}</div>
                <div>
                    <div class="profile-name">${escapeHtml(data.characterName)}</div>
                    <div class="profile-sub">${escapeHtml(data.characterClass)}<br>${escapeHtml(date)}</div>
                </div>
            </article>
            <article class="metric-card">
                <div class="metric-label">현재 API 전투력</div>
                <div class="metric-value">${formatValue(current.currentCombatPower ?? 0)}</div>
                <div class="metric-foot">${current.errorRatePercent == null ? "-" : `오차율 <strong>${formatPercent(current.errorRatePercent)}</strong>`}</div>
            </article>
            <article class="metric-card">
                <div class="metric-label">현재 계산 전투력</div>
                <div class="metric-value">${formatValue(current.estimatedCombatPower)}</div>
                <div class="metric-foot">차이 <strong>${formatSignedValue(current.difference ?? 0)}</strong></div>
            </article>
            <article class="metric-card">
                <div class="metric-label">Combat Preset 계산 전투력</div>
                <div class="metric-value">${formatValue(combat.estimatedCombatPower)}</div>
                <div class="metric-foot">${combat.lucidTransformSuspected ? "루시드 변신 의심 있음" : "루시드 변신 의심 없음"}</div>
            </article>
            <article class="metric-card">
                <div class="metric-label">현재 모드</div>
                <div class="metric-value">${state.range === "monthly" ? "30일" : "1년"}</div>
                <div class="metric-foot">핀 중심 대시보드</div>
            </article>
        `;
    }

    function renderWarning(data) {
        const entry = Array.isArray(data.entries) ? normalizeEntry(data.entries[0]) : null;
        const current = entry?.currentPresetDataSheet?.lucidTransformSuspected;
        const combat = entry?.combatPresetDataSheet?.lucidTransformSuspected;
        if (!current && !combat) {
            warningEl.hidden = true;
            warningEl.textContent = "";
            return;
        }

        warningEl.hidden = false;
        warningEl.textContent = "루시드 변신 의심 플래그가 감지되었습니다. 0차 스킬 또는 예외 스탯이 포함된 상태일 수 있으니 계산 전투력 해석에 주의해주세요.";
    }

    function renderInsights(data) {
        const entry = Array.isArray(data.entries) ? normalizeEntry(data.entries[0]) : null;
        const current = entry?.currentPresetDataSheet;
        const combat = entry?.combatPresetDataSheet;
        const date = entry?.date ?? "-";
        data.date = date;
        insightListEl.innerHTML = `
            <div class="timeline-item">
                <div class="timeline-date">현재 API 전투력</div>
                <div class="timeline-value">${formatValue(current.currentCombatPower ?? 0)}</div>
                <div class="timeline-note">기준 날짜 ${escapeHtml(data.date)}</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">현재 계산 전투력</div>
                <div class="timeline-value">${formatValue(current.estimatedCombatPower)}</div>
                <div class="timeline-note">차이 ${formatSignedValue(current.difference ?? 0)}</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">Combat Preset</div>
                <div class="timeline-value">${formatValue(combat.estimatedCombatPower)}</div>
                <div class="timeline-note">이력 변화 핀 기준값</div>
            </div>
        `;
    }

    function renderSummaryFromHistory(response) {
        const rows = Array.isArray(response?.entries) ? response.entries.map(normalizeEntry) : [];
        const latest = rows.length ? rows[rows.length - 1] : null;
        if (!latest) {
            summaryGridEl.innerHTML = `
                <article class="metric-card">
                    <div class="metric-label">캐릭터 이름</div>
                    <div class="metric-value">${escapeHtml(response?.characterName ?? "")}</div>
                    <div class="metric-foot">이력 데이터만 로드됨</div>
                </article>
            `;
            return;
        }

        summaryGridEl.innerHTML = `
            <article class="metric-card profile-card">
                <div class="avatar">${renderAvatar(response.characterClass)}</div>
                <div>
                    <div class="profile-name">${escapeHtml(response.characterName)}</div>
                    <div class="profile-sub">${escapeHtml(response.characterClass)}<br>${escapeHtml(latest.date)}</div>
                </div>
            </article>
            <article class="metric-card">
                <div class="metric-label">최근 Current 계산 전투력</div>
                <div class="metric-value">${formatValue(latest.currentPresetDataSheet?.estimatedCombatPower ?? latest.combatPresetDataSheet?.estimatedCombatPower ?? 0)}</div>
                <div class="metric-foot">이력 기준 최신 시점</div>
            </article>
            <article class="metric-card">
                <div class="metric-label">최근 Current API 전투력</div>
                <div class="metric-value">${formatValue(latest.currentPresetDataSheet?.currentCombatPower ?? 0)}</div>
                <div class="metric-foot">월간/연간 조회 결과</div>
            </article>
            <article class="metric-card">
                <div class="metric-label">최근 Combat Preset</div>
                <div class="metric-value">${formatValue(latest.combatPresetDataSheet?.estimatedCombatPower ?? 0)}</div>
                <div class="metric-foot">${state.range === "monthly" ? "30일" : "1년"} 변화 기준</div>
            </article>
            <article class="metric-card">
                <div class="metric-label">현재 모드</div>
                <div class="metric-value">${state.range === "monthly" ? "30일" : "1년"}</div>
                <div class="metric-foot">핀 중심 대시보드</div>
            </article>
        `;
    }

    function renderWarningFromHistory(rows) {
        const latest = Array.isArray(rows) && rows.length ? rows[rows.length - 1] : null;
        const current = latest?.currentPresetDataSheet?.lucidTransformSuspected;
        const combat = latest?.combatPresetDataSheet?.lucidTransformSuspected;
        if (!current && !combat) {
            warningEl.hidden = true;
            warningEl.textContent = "";
            return;
        }

        warningEl.hidden = false;
        warningEl.textContent = "猷⑥떆??蹂???섏떖 ?뚮옒洹멸? 媛먯??섏뿀?듬땲?? 0李??ㅽ궗 ?먮뒗 ?덉쇅 ?ㅽ꺈???ы븿???곹깭?????덉쑝??怨꾩궛 ?꾪닾???댁꽍??二쇱쓽?댁＜?몄슂.";
    }

    function renderInsightsFromHistory(rows) {
        const diffs = buildCombatDiffs(rows);
        const latest = diffs.length ? diffs[diffs.length - 1] : null;
        if (!latest) {
            insightListEl.innerHTML = `<div class="empty-state">표시할 요약 데이터가 없습니다.</div>`;
            return;
        }

        insightListEl.innerHTML = `
            <div class="timeline-item">
                <div class="timeline-date">최근 변화일</div>
                <div class="timeline-value">${escapeHtml(latest.date)}</div>
                <div class="timeline-note">이력에서 마지막으로 감지된 변화 시점</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">직전 대비 변화량</div>
                <div class="timeline-value">${formatSignedValue(latest.deltaCombatPower)}</div>
                <div class="timeline-note">이전 시점 ${escapeHtml(latest.previousDate)} 대비</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">누적 변화량</div>
                <div class="timeline-value">${formatSignedValue(latest.cumulativeDeltaCombatPower)}</div>
                <div class="timeline-note">${state.range === "monthly" ? "30일" : "1년"} 기준 누적</div>
            </div>
        `;
    }

    function renderHistorySection() {
        const diffs = buildCombatDiffs(state.historyRows);
        chartCopyEl.textContent = `${state.range === "monthly" ? "월간" : "연간"} 이력에서 전투력 변화가 있었던 시점을 핀으로 표시합니다.`;

        if (!diffs.length) {
            trendSvgEl.innerHTML = "";
            pinLayerEl.innerHTML = "";
            yAxisEl.innerHTML = "";
            xAxisEl.innerHTML = "";
            recentChangesEl.innerHTML = "";
            timelineListEl.innerHTML = `<div class="empty-state">변화가 있는 이력 데이터가 아직 없습니다. 월간/연간 조회 결과를 먼저 확인해주세요.</div>`;
            return;
        }

        state.activeIndex = Math.min(state.activeIndex, diffs.length - 1);
        renderChart(diffs);
        renderRecentChanges(diffs);
        renderTimeline(diffs);
    }

    function buildCombatDiffs(rows) {
        if (!Array.isArray(rows) || rows.length < 2) {
            return [];
        }

        const diffs = [];
        const firstCombatPower = Number(rows[0].combatPresetDataSheet?.estimatedCombatPower ?? 0);

        for (let index = 1; index < rows.length; index += 1) {
            const previousRow = rows[index - 1];
            const currentRow = rows[index];
            const previousCombatPower = Number(previousRow.combatPresetDataSheet?.estimatedCombatPower ?? 0);
            const currentCombatPower = Number(currentRow.combatPresetDataSheet?.estimatedCombatPower ?? 0);
            const changeSummary = currentRow.combatPresetDataSheet?.changeSummary
                ?? buildChangeSummary(previousRow.dataSheet, currentRow.dataSheet);

            diffs.push({
                index: diffs.length,
                date: currentRow.date,
                previousDate: previousRow.date,
                previousCombatPower,
                currentCombatPower,
                deltaCombatPower: currentCombatPower - previousCombatPower,
                cumulativeDeltaCombatPower: currentCombatPower - firstCombatPower,
                changeSummary,
                lucidTransformSuspected: Boolean(currentRow.combatPresetDataSheet?.lucidTransformSuspected),
                detailRows: buildDetailRows(changeSummary)
            });
        }

        return diffs;
    }

    function buildDetailRows(changeSummary) {
        if (!changeSummary) {
            return [];
        }

        const groups = [
            ...(changeSummary.coreChanges ?? []).map((change) => ({
                label: change.source,
                value: formatDeltaList(change.deltas)
            })),
            ...flattenSlotChanges("펫", changeSummary.petChanges),
            ...flattenSlotChanges("캐시", changeSummary.cashChanges),
            ...flattenSlotChanges("장비", changeSummary.itemChanges)
        ];

        return groups.filter((group) => group.value);
    }

    const statFields = [
        "STR", "DEX", "INT", "LUK", "HP", "ALL_STAT",
        "STR_PER_LEVEL9", "DEX_PER_LEVEL9", "INT_PER_LEVEL9", "LUK_PER_LEVEL9",
        "STR_NO_PERCENT", "DEX_NO_PERCENT", "INT_NO_PERCENT", "LUK_NO_PERCENT", "HP_NO_PERCENT", "ALL_STAT_NO_PERCENT",
        "ATTACK_POWER", "MAGIC_POWER",
        "STR_PERCENT", "DEX_PERCENT", "INT_PERCENT", "LUK_PERCENT", "HP_PERCENT", "ALL_STAT_PERCENT",
        "ATTACK_POWER_PERCENT", "MAGIC_POWER_PERCENT",
        "DAMAGE", "BOSS_DAMAGE", "CRITICAL_DAMAGE", "FINAL_DAMAGE"
    ];

    const coreSheetNames = [
        "abilityPoint", "symbol", "skill", "hexaStat", "ability", "hyperStat", "setEffect",
        "unionOccupied", "unionRaider", "unionArtifact", "unionChampion"
    ];

    function buildChangeSummary(previousDataSheet, currentDataSheet) {
        if (!previousDataSheet || !currentDataSheet) {
            return null;
        }

        return {
            coreChanges: coreSheetNames
                .map((name) => buildCoreChange(name, previousDataSheet[name], currentDataSheet[name]))
                .filter(Boolean)
                .sort((left, right) => right.weight - left.weight)
                .slice(0, 6),
            petChanges: buildSlotChanges(previousDataSheet.petEquip, currentDataSheet.petEquip, 3),
            cashChanges: buildSlotChanges(previousDataSheet.cashEquip, currentDataSheet.cashEquip, 3),
            itemChanges: buildSlotChanges(previousDataSheet.itemEquip, currentDataSheet.itemEquip, 5)
        };
    }

    function buildCoreChange(source, beforeSheet, afterSheet) {
        const deltas = statDeltas(beforeSheet, afterSheet, 3);
        if (!deltas.length) {
            return null;
        }
        return { source, deltas, weight: deltaWeight(deltas) };
    }

    function buildSlotChanges(beforeItems = {}, afterItems = {}, limit) {
        const slots = [...new Set([...Object.keys(beforeItems ?? {}), ...Object.keys(afterItems ?? {})])];
        return slots
            .map((slot) => buildSlotChange(slot, beforeItems?.[slot], afterItems?.[slot]))
            .filter(Boolean)
            .sort((left, right) => right.weight - left.weight)
            .slice(0, limit);
    }

    function buildSlotChange(slot, beforeItem, afterItem) {
        const deltas = statDeltas(beforeItem?.statSheet, afterItem?.statSheet, 15);
        const sameName = beforeItem && afterItem && beforeItem.itemName === afterItem.itemName;
        if (sameName && !deltas.length) {
            return null;
        }

        return {
            slot,
            previousSlot: beforeItem ? slot : null,
            currentSlot: afterItem ? slot : null,
            changeType: !beforeItem ? "ADDED" : !afterItem ? "REMOVED" : sameName ? "STAT_CHANGED" : "REPLACED",
            previousItemName: beforeItem?.itemName ?? null,
            currentItemName: afterItem?.itemName ?? null,
            previousItemIcon: beforeItem?.itemIcon ?? null,
            currentItemIcon: afterItem?.itemIcon ?? null,
            deltas,
            weight: deltaWeight(deltas)
        };
    }

    function statDeltas(beforeSheet = {}, afterSheet = {}, limit) {
        return statFields
            .map((field) => ({
                statName: field,
                delta: Number(afterSheet?.[field] ?? 0) - Number(beforeSheet?.[field] ?? 0)
            }))
            .filter((delta) => delta.delta !== 0)
            .sort((left, right) => Math.abs(right.delta) - Math.abs(left.delta))
            .slice(0, limit);
    }

    function deltaWeight(deltas) {
        return deltas.reduce((sum, delta) => sum + Math.floor(Math.abs(delta.delta)), 0);
    }

    function flattenSlotChanges(groupLabel, changes) {
        if (!Array.isArray(changes)) {
            return [];
        }

        return changes.map((change) => ({
            label: `${groupLabel} · ${change.slot} · ${change.changeType}`,
            value: formatDeltaList(change.deltas)
        }));
    }

    function renderChart(diffs) {
        const values = diffs.map((diff) => diff.currentCombatPower);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const spread = Math.max(max - min, 1);
        const padding = spread * 0.15;
        const chartMin = Math.max(0, min - padding);
        const chartMax = max + padding;

        yAxisEl.innerHTML = buildYAxis(chartMin, chartMax);
        xAxisEl.innerHTML = diffs.map((diff) => `<span>${escapeHtml(formatShortDate(diff.date))}</span>`).join("");

        const points = diffs.map((diff, index) => {
            const x = diffs.length === 1 ? 430 : 16 + (828 * index / (diffs.length - 1));
            const normalized = (diff.currentCombatPower - chartMin) / (chartMax - chartMin || 1);
            const y = 288 - (normalized * 248);
            return { x, y };
        });

        const linePath = points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ");
        const areaPath = `${linePath} L ${points[points.length - 1].x} 304 L ${points[0].x} 304 Z`;

        trendSvgEl.innerHTML = `
            <defs>
                <linearGradient id="growthFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(125, 191, 83, 0.34)"></stop>
                    <stop offset="100%" stop-color="rgba(125, 191, 83, 0.02)"></stop>
                </linearGradient>
            </defs>
            <path d="${areaPath}" fill="url(#growthFill)"></path>
            <path d="${linePath}" fill="none" stroke="#71b04a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        `;

        pinLayerEl.innerHTML = diffs.map((diff, index) => {
            const point = points[index];
            const left = `${((point.x - 16) / 828) * 100}%`;
            const top = `${((point.y - 40) / 248) * 100}%`;
            return `
                <button
                    class="trend-pin${state.activeIndex === index ? " active" : ""}"
                    data-index="${index + 1}"
                    data-diff-index="${index}"
                    style="left: ${left}; top: ${top};"
                    aria-label="${escapeHtml(diff.date)} 변화 핀"
                ></button>
            `;
        }).join("") + `<div class="pin-tooltip" id="pin-tooltip"></div>`;

        const tooltip = document.getElementById("pin-tooltip");
        [...pinLayerEl.querySelectorAll(".trend-pin")].forEach((pin) => {
            pin.addEventListener("mouseenter", () => activateDiff(Number(pin.dataset.diffIndex), tooltip));
            pin.addEventListener("focus", () => activateDiff(Number(pin.dataset.diffIndex), tooltip));
            pin.addEventListener("click", () => activateDiff(Number(pin.dataset.diffIndex), tooltip));
        });

        activateDiff(state.activeIndex, tooltip);
    }

    function activateDiff(index, tooltip) {
        state.activeIndex = index;
        const diffs = buildCombatDiffs(state.historyRows);
        const diff = diffs[index];
        if (!diff) {
            tooltip.classList.remove("visible");
            return;
        }

        [...pinLayerEl.querySelectorAll(".trend-pin")].forEach((pin) => {
            pin.classList.toggle("active", Number(pin.dataset.diffIndex) === index);
        });

        const activePin = pinLayerEl.querySelector(`.trend-pin[data-diff-index="${index}"]`);
        tooltip.style.left = activePin.style.left;
        tooltip.style.top = activePin.style.top;
        tooltip.innerHTML = `
            <div class="tooltip-date">${escapeHtml(diff.date)} · 이전 ${escapeHtml(diff.previousDate)}</div>
            <div class="tooltip-value">${formatSignedValue(diff.deltaCombatPower)}</div>
            <div class="tooltip-growth">누적 ${formatSignedValue(diff.cumulativeDeltaCombatPower)}</div>
            <div class="tooltip-list">
                <div class="tooltip-row">
                    <span>변경 전 전투력</span>
                    <strong>${formatValue(diff.previousCombatPower)}</strong>
                </div>
                <div class="tooltip-row">
                    <span>변경 후 전투력</span>
                    <strong>${formatValue(diff.currentCombatPower)}</strong>
                </div>
                ${diff.detailRows.slice(0, 4).map((row) => `
                    <div class="tooltip-row">
                        <span>${escapeHtml(row.label)}</span>
                        <strong>${escapeHtml(row.value)}</strong>
                    </div>
                `).join("")}
            </div>
        `;
        tooltip.classList.add("visible");

        renderTimeline(diffs);
    }

    function renderRecentChanges(diffs) {
        recentChangesEl.innerHTML = diffs.slice().reverse().slice(0, 4).map((diff) => `
            <article class="change-chip">
                <div class="chip-date">${escapeHtml(diff.date)}</div>
                <div class="chip-value">${formatSignedValue(diff.deltaCombatPower)}</div>
                <div class="chip-note">${escapeHtml(diff.detailRows[0]?.value || "변화 요약 없음")}</div>
            </article>
        `).join("");
    }

    function renderTimeline(diffs) {
        timelineListEl.innerHTML = diffs.slice().reverse().map((diff) => {
            const index = diff.index;
            return `
                <div class="timeline-item${state.activeIndex === index ? " is-active" : ""}">
                    <button type="button" data-timeline-index="${index}">
                        <div class="timeline-date">${escapeHtml(diff.date)}</div>
                        <div class="timeline-value">${formatSignedValue(diff.deltaCombatPower)}</div>
                        <div class="timeline-note">${escapeHtml(diff.detailRows[0]?.value || "상세 변화 요약 없음")}</div>
                    </button>
                </div>
            `;
        }).join("");

        [...timelineListEl.querySelectorAll("[data-timeline-index]")].forEach((button) => {
            button.addEventListener("click", () => {
                const tooltip = document.getElementById("pin-tooltip");
                activateDiff(Number(button.dataset.timelineIndex), tooltip);
            });
        });
    }

    function buildYAxis(min, max) {
        const steps = 5;
        const values = [];
        for (let index = 0; index < steps; index += 1) {
            const ratio = (steps - 1 - index) / (steps - 1);
            values.push(`<span>${formatAxisValue(min + ((max - min) * ratio))}</span>`);
        }
        return values.join("");
    }

    function syncRangeTabs() {
        rangeTabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.range === state.range));
    }

    function renderAvatar(characterClass) {
        const initial = (characterClass || "M").trim().charAt(0).toUpperCase();
        return `<span>${escapeHtml(initial || "M")}</span>`;
    }

    function formatAxisValue(value) {
        const number = Number(value);
        if (number >= 100000000) {
            return `${(number / 100000000).toFixed(1).replace(/\.0$/, "")}억`;
        }
        if (number >= 10000) {
            return `${Math.round(number / 10000).toLocaleString("ko-KR")}만`;
        }
        return Math.round(number).toLocaleString("ko-KR");
    }

    function formatShortDate(date) {
        if (!date || !date.includes("-")) {
            return date || "-";
        }
        return date.slice(5).replace("-", ".");
    }

    function formatValue(value) {
        return Number(value ?? 0).toLocaleString("ko-KR");
    }

    function formatSignedValue(value) {
        const number = Number(value ?? 0);
        const sign = number > 0 ? "+" : "";
        return `${sign}${number.toLocaleString("ko-KR")}`;
    }

    function formatDeltaList(deltas) {
        if (!Array.isArray(deltas) || !deltas.length) {
            return "";
        }

        return deltas
            .map((delta) => `${delta.statName} ${formatSignedDecimalValue(delta.delta)}`)
            .join(", ");
    }

    function formatSignedDecimalValue(value) {
        const number = Number(value ?? 0);
        const sign = number > 0 ? "+" : "";
        const formatted = Number.isInteger(number)
            ? number.toLocaleString("ko-KR")
            : number.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
        return `${sign}${formatted}`;
    }

    function formatPercent(value) {
        if (value == null) {
            return "-";
        }
        return `${Number(value).toLocaleString("ko-KR", { maximumFractionDigits: 2 })}%`;
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#39;");
    }

    syncRangeTabs();
</script>
