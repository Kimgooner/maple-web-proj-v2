# 실제 접속 상대가 Cloudflare 인가. cloudflare-ips.conf 와 같은 목록이다 — 둘을 같이 갱신한다.
#
# IP 로 직접 와서 Host 만 mapledelta.kr 로 붙이면 Cloudflare(레이트 리밋·봇 차단)를 우회할 수 있어
# 서버 블록에서 이 값이 0 이면 끊는다. allow/deny 모듈은 real_ip 로 되찾은 *뒤의* $remote_addr 를
# 보므로 쓸 수 없고, 되찾기 전 주소인 $realip_remote_addr 로 geo 를 잰다.
#
# 사설 대역은 배포 헬스 체크(서버 안에서 curl) 용이다. 밖에서는 이 주소로 올 수 없다.
geo $realip_remote_addr $from_cloudflare {
  default 0;
  127.0.0.0/8 1;
  10.0.0.0/8 1;
  172.16.0.0/12 1;
  192.168.0.0/16 1;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}
