server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 해시 붙은 파일이라 내용이 바뀌면 이름이 바뀐다. 영구 캐시해도 된다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 경로 라우팅. /c/이름 을 새로고침해도 index.html 이 나가야 한다.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    # 업스트림을 변수로 두면 nginx 가 요청 때 이름을 푼다. 이름을 직접 쓰면 기동할 때
    # 풀리지 않는 순간(앱 컨테이너가 내려가 있거나 아직 안 뜬 때) nginx 자체가 죽어
    # 정적 화면까지 같이 사라진다. 변수로 두면 그럴 때 502 만 내고 화면은 뜬다.
    # 127.0.0.11 은 도커 내장 DNS 다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:8080;
    proxy_pass http://$upstream_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE. 버퍼링이 켜져 있으면 진행률이 0% 에서 멈췄다가 한 번에 끝난다.
    proxy_buffering off;
    proxy_cache off;

    # 일간 30지점 콜드 조회가 수십 초 걸린다.
    proxy_read_timeout 600s;
  }
}
