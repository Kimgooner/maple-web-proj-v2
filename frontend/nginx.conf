# IP 당 요청·연결 상한. conf.d 는 http 블록 안으로 들어가므로 여기 두면 http 수준이다.
#
# 조회 한 번이 넥슨 API 를 최대 511회 쓴다(스냅샷 17회 × 30지점). 상한이 없으면 한 사람이
# 캐릭터명을 돌려 가며 부르는 것만으로 넥슨 초당 한도(500/s)를 혼자 다 먹고, 그 뒤로는
# 정상 이용자의 조회가 줄을 선다. 악의가 없어도 공개 직후 트래픽이 몰리면 같은 일이 난다.
#
# 1초에 1건 + 순간 30건까지. 사람이 화면을 쓰는 속도(조회 1 + 구간 클릭 몇 번)에는 걸리지
# 않고, 스크립트로 훑는 속도에는 걸린다. 연결 수는 SSE 때문에 따로 잡는다 - 추이 조회는
# 최대 10분간 연결을 붙들고 있어서, 요청 수만 막으면 연결만 열어 두는 쪽을 못 막는다.
limit_req_zone $binary_remote_addr zone=api_req:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 버전을 응답 헤더로 알릴 이유가 없다.
  server_tokens off;

  # 로그인도 쿠키도 없는 사이트라 크게 걸릴 것은 없지만, 이 셋은 공짜다.
  #  - nosniff: 브라우저가 확장자와 다른 타입으로 추측 실행하는 것을 막는다
  #  - frame-ancestors: 남의 사이트가 우리 화면을 iframe 에 넣어 자기 것처럼 쓰는 것을 막는다
  #  - Referrer-Policy: 캐릭터명이 들어간 주소가 외부 사이트로 새어 나가지 않게 한다
  #
  # location 마다 다시 적는다. nginx 의 add_header 는 하위 블록에 add_header 가 하나라도
  # 있으면 상속이 통째로 끊긴다 - 아래 두 location 은 Cache-Control 을 적고 있어서,
  # 여기에만 두면 정작 사람이 받는 응답에는 안 붙는다.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 해시 붙은 파일이라 내용이 바뀌면 이름이 바뀐다. 영구 캐시해도 된다.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 경로 라우팅. /c/이름 을 새로고침해도 index.html 이 나가야 한다.
  #
  # index.html 은 아예 저장하지 않는다. no-cache 는 "쓰기 전에 물어보라"라서 새로고침에는
  # 듣지만, 이미 열려 있던 탭이나 뒤로가기(bfcache)로 돌아온 화면은 물어보지 않고 옛 문서를
  # 그대로 쓴다 — 배포해도 이전 화면을 계속 보게 된다. no-store 는 bfcache 도 막는다.
  # 문서가 800바이트라 매번 받아도 부담이 없고, 해시 붙은 /assets/ 는 그대로 영구 캐시다.
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    limit_req zone=api_req burst=30 nodelay;
    limit_conn api_conn 8;
    limit_req_status 429;
    limit_conn_status 429;

    # 업스트림을 변수로 두면 nginx 가 요청 때 이름을 푼다. 이름을 직접 쓰면 기동할 때
    # 풀리지 않는 순간(앱 컨테이너가 내려가 있거나 아직 안 뜬 때) nginx 자체가 죽어
    # 정적 화면까지 같이 사라진다. 변수로 두면 그럴 때 502 만 내고 화면은 뜬다.
    # 127.0.0.11 은 도커 내장 DNS 다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:8080;
    proxy_pass http://$upstream_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE. 버퍼링이 켜져 있으면 진행률이 0% 에서 멈췄다가 한 번에 끝난다.
    proxy_buffering off;
    proxy_cache off;

    # 일간 30지점 콜드 조회가 수십 초 걸린다.
    proxy_read_timeout 600s;
  }
}
