<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!--
      ?v= 는 브라우저 캐시를 끊으려고 붙인다. 파비콘은 nginx 의 Cache-Control 과 별개로
      브라우저가 자체 캐시를 오래 붙들고 있어, 파일만 바꾸면 탭 아이콘이 안 바뀐다.
      모양을 고칠 때마다 이 숫자를 올린다.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="theme-color" content="#ec6329" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>MapleDelta · 메이플 전투력 추이 분석</title>

    <!--
      링크를 붙여 넣었을 때 뜨는 카드. 인벤·디시·카톡·디스코드가 여기를 읽는다.
      og:image 는 절대 URL 이어야 하고 SVG 는 대부분 렌더링하지 않아 PNG 를 쓴다
      (`public/og-source.svg` 가 원본 - 모양을 고치면 PNG 를 다시 뽑는다).
    -->
    <meta
      name="description"
      content="메이플스토리 캐릭터의 전투력이 언제, 무엇 때문에 오르내렸는지 하루 단위로 되짚어 봅니다. 장비·심볼·헥사·유니온까지 두 시점을 비교합니다. Lv.260 이상."
    />
    <link rel="canonical" href="https://mapledelta.kr/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MapleDelta" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://mapledelta.kr/" />
    <meta property="og:title" content="MapleDelta · 메이플 전투력 추이 분석" />
    <meta
      property="og:description"
      content="전투력이 언제, 무엇 때문에 올랐는지 하루 단위로 되짚어 봅니다. 장비·심볼·헥사·유니온 변화까지."
    />
    <meta property="og:image" content="https://mapledelta.kr/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
